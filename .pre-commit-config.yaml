repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml

  # Phase B/C/D (manual): lint/format/typecheck for src/core first.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: ["--exit-zero"]
        files: ^src/core/
        stages: [manual]
      - id: ruff-format
        files: ^src/core/
        stages: [manual]

  - repo: https://github.com/psf/black
    rev: 26.1.0
    hooks:
      - id: black
        files: ^src/core/
        stages: [manual]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.9.0
    hooks:
      - id: mypy
        args: ["--ignore-missing-imports"]
        files: ^src/core/
        stages: [manual]
